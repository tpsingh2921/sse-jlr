<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2820"/>
      <stop offset="60%" stop-color="#071913"/>
      <stop offset="100%" stop-color="#020a07"/>
    </linearGradient>

    <!-- Rich Gold Luster Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f5cb74"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7b2c"/>
    </linearGradient>

    <!-- Emerald Energy Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Architectural Foundation Hexagonal Shield -->
  <path d="M40 3 L71 16 L71 52 L40 77 L9 52 L9 16 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Inner Concentric Structural Frame -->
  <path d="M40 9 L65 20 L65 48 L40 69 L15 48 L15 20 Z" fill="none" stroke="url(#emeraldGrad)" stroke-width="1.2" stroke-dasharray="4 2.5" opacity="0.85"/>

  <!-- Solar Radiance Rays Crest (Top Arch) -->
  <g stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.95">
    <line x1="40" y1="9" x2="40" y2="15"/>
    <line x1="49" y1="11" x2="47" y2="17"/>
    <line x1="31" y1="11" x2="33" y2="17"/>
    <line x1="57" y1="15" x2="53" y2="20"/>
    <line x1="23" y1="15" x2="27" y2="20"/>
  </g>

  <!-- Civil Infrastructure Foundation Pillars (Bottom Base) -->
  <path d="M22 55 L28 47 L34 47 L40 55 L46 47 L52 47 L58 55" fill="none" stroke="url(#emeraldGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
  <line x1="20" y1="56" x2="60" y2="56" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Central Dynamic "S" Architectural Monogram -->
  <!-- Upper Curve -->
  <path d="M49 28.5 C49 23 45 20 38.5 20 C32 20 28.5 23.5 28.5 28 C28.5 34 35 36 41 38.5 C47.5 41 51 44.5 51 50 C51 56.5 45.5 60 38 60 C31 60 27 56 27 50.5" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Sleek Structural Inner Core Accent -->
  <path d="M37 25 C39 25 41 26 41 28 C41 30.5 38 32 35 33" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
  <path d="M43 47 C40 48 37 49 37 52 C37 54 39 55 41 55" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>

  <!-- Radiant Core Spark -->
  <circle cx="40" cy="38" r="2.2" fill="#ffffff" filter="url(#coreGlow)"/>
</svg>
