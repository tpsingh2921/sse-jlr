<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="docPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="docGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f5cb74"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <linearGradient id="docEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Document Page Base with Folded Corner -->
  <path d="M14 6 L42 6 L52 16 L52 58 L14 58 Z" fill="url(#docPaper)" stroke="url(#docGold)" stroke-width="2" stroke-linejoin="round"/>
  <!-- Folded Corner Flap -->
  <path d="M42 6 L42 16 L52 16" fill="url(#docEmerald)" stroke="url(#docGold)" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Header Bar -->
  <rect x="20" y="14" width="18" height="3" rx="1.5" fill="url(#docGold)"/>
  <!-- Document Content Lines -->
  <line x1="20" y1="24" x2="46" y2="24" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="31" x2="46" y2="31" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="38" x2="40" y2="38" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <!-- Official Seal Ribbon (Bottom Right) -->
  <circle cx="43" cy="48" r="6" fill="url(#docGold)" stroke="#78350f" stroke-width="1"/>
  <path d="M40 52 L38 58 L41 56 L44 58 L43 52" fill="url(#docEmerald)"/>
  <!-- Star inside seal -->
  <polygon points="43,44.5 44.2,47 47,47.3 45,49.2 45.5,52 43,50.6 40.5,52 41,49.2 39,47.3 41.8,47" fill="#78350f"/>
</svg>
